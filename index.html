<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2C Calculator · 2C Trucking</title>
  <meta name="description" content="2C Trucking trailer rate calculator">
  <link rel="icon" href="assets/favicon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-512.png">
  <!-- Sends visitors straight to the live app after a moment; the button below works right away -->
  <meta http-equiv="refresh" content="3; url=https://script.google.com/macros/s/AKfycbwGq4CtgTG7Uwy6-_abqF00qlPvIB59HBqiZ2PFUErTtOtVN-y8FYjXhscIaV8v5S3s/exec">
  <style>
    :root { --red: #D93126; --ink: #17191D; --soft: #6B7079; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink);
      background: linear-gradient(160deg, #fff5f4 0%, #ffffff 45%, #fde9e7 100%); }
    .card { width: min(100%, 440px); padding: 40px 32px; text-align: center; background: rgba(255,255,255,.85);
      border: 1px solid rgba(217,49,38,.15); border-radius: 24px; box-shadow: 0 24px 60px rgba(23,25,29,.10); }
    .logo { width: 150px; height: auto; display: block; margin: 0 auto 18px; }
    h1 { margin: 0 0 6px; font-size: 30px; font-weight: 400; font-family: Georgia, "Times New Roman", serif; }
    h1 em { font-style: italic; color: var(--red); }
    p { margin: 0 0 24px; color: var(--soft); font-size: 14px; line-height: 1.5; }
    .btn { display: inline-block; padding: 14px 28px; background: var(--red); color: #fff; text-decoration: none; font-weight: 700;
      border-radius: 999px; box-shadow: 0 8px 20px rgba(217,49,38,.28); }
    .btn:hover { background: #bf281e; }
    .small { margin: 18px 0 0; font-size: 12px; }
    .small a { color: var(--red); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/icon-512.png" alt="2C Trucking">
    <h1>2C <em>Calculator</em></h1>
    <p>Trailer rate calculator for 2C Trucking. Opening the app…</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbwGq4CtgTG7Uwy6-_abqF00qlPvIB59HBqiZ2PFUErTtOtVN-y8FYjXhscIaV8v5S3s/exec">Open 2C Calculator</a>
    <p class="small">Sign in with your Google account when asked. <a href="https://github.com/ManuObuenIII/2CRateCalculator">Source code</a></p>
  </main>
</body>
</html>
